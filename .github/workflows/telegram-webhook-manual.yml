name: Configure Telegram webhook (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Register Telegram webhook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          missing=0
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the two secrets under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
      - name: Register webhook with Telegram
        run: node scripts/set-telegram-webhook.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_URL: https://erd-algwal.vercel.app/api/telegram/webhook
